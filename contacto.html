    <meta name="keywords" content="Contacto, formulario, mensaje, correo, Fredy Santiago Rincon Africano">
    <meta name="robots" content="index, follow">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <header class="encabezado-sitio">
        <p class="nombre-marca">Fredy Santiago Rincon Africano</p>
        <nav class="navegacion-principal">
            <a href="index.html">Inicio</a>
            <a href="proyectos.html">Proyectos</a>
            <a href="articulos.html">Artículos</a>
            <a href="contacto.html">Contacto</a>
            <button id="boton-tema" class="boton-tema" type="button">🌙 Modo oscuro</button>
        </nav>
    </header>

    <main class="contenido-principal contenido-contacto">

        <h1>Contacto</h1>
        <p>¿Quieres hablar de un proyecto o resolver una duda? Escríbeme y te responderé pronto.</p>

        <form class="formulario-contacto" action="#" method="POST">

            <div class="campo-formulario">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
            </div>

            <div class="campo-formulario">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo-formulario">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>

            <button type="submit" class="boton-enviar">Enviar</button>
        </form>

    </main>

    <footer class="pie-pagina">

    </footer>
